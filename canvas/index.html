<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/" } }
</script>
</head>
<body>
<div class="app">
  <header>
    <b>MONET</b>
    <select id="project" title="project"></select>
    <button id="newProject" title="new project">+</button>
    <span class="sp"></span>
    <span class="muted" id="wsName"></span>
    <button class="primary" id="connect">Connect your agent</button>
  </header>

  <aside>
    <p class="head">Notes</p>
    <div id="notes"></div>
    <p class="head" style="margin-top:18px">Versions</p>
    <div id="versions"></div>
  </aside>

  <div class="view" id="view">
    <canvas id="gl"></canvas>
    <div class="bar top">
      <button data-cam="fit" title="fit to view">Fit</button>
      <button data-cam="iso">Iso</button><button data-cam="top">Top</button><button data-cam="front">Front</button><button data-cam="right">Right</button>
      <span class="sep"></span>
      <button id="edges" class="on" title="show the edges of the part">Edges</button>
      <button id="xray" title="see through the part">X-ray</button>
      <button id="section" title="cut the part with a plane to see inside">Section</button>
      <select id="sectionAxis" hidden><option>X</option><option>Y</option><option selected>Z</option></select>
      <input type="range" id="sectionAt" min="0" max="1" step="0.002" value="0.5" hidden>
      <span class="sep" id="asmSep" hidden></span>
      <button id="partColours" class="on" title="every part of the assembly in a colour of its own" hidden>Parts</button>
      <span class="muted" id="explodeLabel" hidden>Explode</span>
      <input type="range" id="explode" min="0" max="1.5" step="0.01" value="0" title="pull the parts of the assembly apart" hidden>
    </div>
    <div class="bar bottom" id="compare" hidden>
      <span id="compareLabel" class="muted"></span>
      <button data-mode="added" title="the newer one, coloured where material was added">Added</button>
      <button data-mode="removed" title="the older one, coloured where material was removed">Removed</button>
      <button data-mode="blink" title="flick between the two: the eye catches small jumps">Blink</button>
      <button data-mode="fade" title="crossfade from the older to the newer">Fade</button>
      <button data-mode="wipe" title="older on one side of a plane, newer on the other">Wipe</button>
      <input type="range" id="mix" min="0" max="1" step="0.005" value="0.5" hidden>
      <button id="compareOff">×</button>
    </div>
    <div class="busy" id="busy" hidden>building…</div>
    <div class="hint">drag: orbit · right-drag: pan · wheel: zoom · click a face to point at it</div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<dialog id="connectDialog"></dialog>
<script type="module" src="/static/canvas.js"></script>
</body>
</html>
