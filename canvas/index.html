<!doctype html>
<html lang="en" data-skin="cyber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/cyber.css">
<script src="/static/hole.js" defer></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/" } }
</script>
</head>
<body>
<div class="app">
  <header>
    <canvas class="hole" aria-hidden="true"></canvas><b>MONET</b>
    <span class="chip" id="chip"></span>
    <button id="project" title="the projects of this workspace: open one, start one, download, upload or delete"><span id="projectName">no project</span><span class="chev"></span></button>
    <span class="rooms" title="four places to work: a drawing on a face, one part, the parts put together, and how they move">
      <button data-room="sketch">Sketch</button><button data-room="part">Part</button><button data-room="assembly">Assembly</button><button data-room="motion">Motion</button>
    </span>
    <span class="sp"></span>
    <span class="muted" id="wsName"></span>
    <a class="quiet" id="usersLink" href="/users" hidden>Users</a>
    <a class="quiet" id="logout" href="#">Log out</a>
    <button class="primary" id="connect">Connect your agent</button>
  </header>

  <aside>
    <section data-card="side-planes" data-rooms="sketch">
      <div class="fold" data-fold="side-planes"><span class="chev"></span><span class="head">Planes</span></div>
      <div class="body" id="planesList"></div>
    </section>
    <section data-card="side-sketches" data-rooms="sketch">
      <div class="fold" data-fold="side-sketches"><span class="chev"></span><span class="head">Sketches</span></div>
      <div class="body" id="sketchList"></div>
    </section>
    <section data-card="side-notes">
      <div class="fold" data-fold="side-notes"><span class="chev"></span><span class="head">Notes</span></div>
      <div class="body" id="notes"></div>
    </section>
    <section data-card="side-versions" data-rooms="part assembly motion">
      <div class="fold" data-fold="side-versions"><span class="chev"></span><span class="head">Versions</span></div>
      <div class="body" id="versions"></div>
    </section>
  </aside>

  <div class="view" id="view">
    <canvas id="gl"></canvas>
    <div id="marquee" hidden></div>
    <div id="dim" hidden></div>
    <div id="planeLabels"></div>
    <!-- after Adam Designer: tools on the left rail; how the part is seen, and what a click takes, on the right one;
         the navigation cube in the corner between, with the camera under it -->
    <div class="rail left">
      <div class="rail-sec draw" data-rooms="sketch" data-sketching>
        <div class="rail-title">Draw</div>
        <button data-tool="line" title="a line, point by point: click the first point again to close it, Enter to end it open"><span class="ico">╱</span>Line</button>
        <button data-tool="rect" title="a rectangle: two opposite corners"><span class="ico">▭</span>Rectangle</button>
        <button data-tool="circle" title="a circle: its centre, then a point on it"><span class="ico">○</span>Circle</button>
        <button data-tool="oval" title="an oval: the two ends of one axis, at any angle, then how far the other axis reaches"><span class="ico">⬭</span>Oval</button>
      </div>
      <div class="rail-sec change" data-rooms="sketch" data-sketching>
        <div class="rail-title">Change</div>
        <button data-tool="offset" title="a copy of a curve, a set distance off it, on the side you point at"><span class="ico">⫽</span>Offset</button>
        <button data-tool="trim" title="take away a stretch of a curve, up to where other curves cross it"><span class="ico">✂</span>Trim</button>
        <button data-tool="fillet" title="round a corner between two straight lines"><span class="ico">◜</span>Fillet</button>
        <span class="rail-label" id="sketchValueLabel" hidden>by</span><input id="sketchValue" value="2" inputmode="decimal" title="millimetres: the distance of an offset, the radius of a fillet" hidden>
      </div>
      <div class="rail-sec edit" data-rooms="sketch" data-sketching>
        <div class="rail-title">Edit</div>
        <button id="sketchUndo" title="back to before the last change (Ctrl+Z)"><span class="ico">↶</span>Undo</button>
        <button id="sketchSnap" class="on" title="points line up with the part's corners and land on the 1 mm grid (hold Shift for free)"><span class="ico">⌖</span>Snap</button>
      </div>
      <div class="rail-sec motion" data-rooms="motion">
        <div class="rail-title">Motion</div>
        <button id="poseHome" title="every joint back to 0: the parts as built"><span class="ico">⌂</span>As built</button>
        <button id="jointNew" title="a joint: which part moves, on which, about or along what"><span class="ico">⟳</span>Joint</button>
        <button id="groupMake" title="the selected parts move as one: a rigid group"><span class="ico">⛓</span>Group</button>
      </div>
      <div class="rail-sec tools" data-rooms="part assembly">
        <div class="rail-title">Tools</div>
        <button id="measure" title="measure: click one thing, then another, of any kind. The shortest distance between them is drawn in the view"><span class="ico">⟷</span>Measure</button>
        <button id="boxTool" title="while on, a plain drag selects with a box instead of turning the view (Shift-drag and Ctrl-drag always do)"><span class="ico">⬚</span>Box</button>
        <button id="section" title="cut the part with a plane to see inside"><span class="ico">◧</span>Section</button>
        <div class="rail-pop" id="sectionPop" hidden>
          <select id="sectionAxis" title="the plane cuts across this axis"><option>X</option><option>Y</option><option selected>Z</option></select>
          <input type="range" id="sectionAt" min="0" max="1" step="0.002" value="0.5" title="where along it">
        </div>
      </div>
    </div>
    <div class="rail right" id="railRight" data-rooms="part assembly motion">
      <div class="rail-sec look">
        <div class="rail-title">View</div>
        <select id="style" title="how the part is drawn: with its materials, plainly shaded, or as lines with the hidden ones left out"></select>
        <button id="edges" class="on" title="draw the edges of the part over it"><span class="ico">▦</span>Edges</button>
        <button id="xray" title="see through the part"><span class="ico">◌</span>X-ray</button>
      </div>
      <div class="rail-sec select">
        <div class="rail-title">Select</div>
        <button data-sel="vertex" title="select corner points"><span class="ico">•</span>Points</button>
        <button data-sel="edge" title="select edges"><span class="ico">╱</span>Lines</button>
        <button data-sel="face" class="on" title="select faces"><span class="ico">◼</span>Faces</button>
        <button data-sel="part" data-rooms="assembly motion" title="select whole objects: the parts of an assembly"><span class="ico">▣</span>Objects</button>
      </div>
      <div class="rail-sec assembly" data-rooms="part assembly">
        <div class="rail-title">Assembly</div>
        <button id="partColours" class="on" title="every part of the assembly in a colour of its own" hidden><span class="ico">◐</span>Parts</button>
        <span class="rail-label" id="explodeLabel" hidden>Explode</span>
        <input type="range" id="explode" min="0" max="1.5" step="0.01" value="0" title="pull the parts of the assembly apart" hidden>
      </div>
    </div>
    <div class="view-tools" id="viewTools" data-rooms="part assembly motion">
      <div class="row"><button data-cam="iso" title="home: from the front right, a little above">⌂</button><button data-cam="fit" title="fit to view">Fit</button></div>
      <select id="projection" title="orthographic: sizes stay true across the part, as in a drawing; perspective: near is bigger, as the eye sees it"><option value="ortho">Orthographic</option><option value="perspective">Perspective</option></select>
      <select id="lens" title="the camera's angle of view: narrow is a long lens, wide shows the depth strongly" hidden><option value="15">15°</option><option value="25">25°</option><option value="35" selected>35°</option><option value="50">50°</option><option value="70">70°</option></select>
    </div>
    <div class="bar bottom" id="compare" hidden>
      <span id="compareLabel" class="muted"></span>
      <button data-mode="added" title="the newer one, coloured where material was added">Added</button>
      <button data-mode="removed" title="the older one, coloured where material was removed">Removed</button>
      <button data-mode="blink" title="flick between the two: the eye catches small jumps">Blink</button>
      <button data-mode="fade" title="crossfade from the older to the newer">Fade</button>
      <button data-mode="wipe" title="older on one side of a plane, newer on the other">Wipe</button>
      <input type="range" id="mix" min="0" max="1" step="0.005" value="0.5" hidden>
      <button id="compareOff">×</button>
    </div>
    <div class="build">
      <div class="busy" id="busy" hidden><span id="busyText"></span><div class="track" id="busyTrack"><i id="busyBar"></i></div></div>
      <div class="last" id="last" hidden></div>
    </div>
    <div class="hint">drag: orbit · right-drag: pan · wheel: zoom<br>click: select · Shift: add · Ctrl: take away · Shift- or Ctrl-drag: box</div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<dialog id="connectDialog"></dialog>
<dialog id="projectsDialog"></dialog>
<script type="module" src="/static/canvas.js"></script>
</body>
</html>
