<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monet</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/" } }
</script>
</head>
<body>
<div class="app">
  <header>
    <b>MONET</b>
    <select id="project" title="project"></select>
    <button id="newProject" title="new project">+</button>
    <span class="rooms" title="three places to work: a drawing on a face, one part, the parts put together">
      <button data-room="sketch">Sketch</button><button data-room="part">Part</button><button data-room="assembly">Assembly</button>
    </span>
    <span class="sp"></span>
    <span class="muted" id="wsName"></span>
    <button class="primary" id="connect">Connect your agent</button>
  </header>

  <aside>
    <section data-card="side-notes">
      <div class="fold" data-fold="side-notes"><span class="chev"></span><span class="head">Notes</span></div>
      <div class="body" id="notes"></div>
    </section>
    <section data-card="side-versions">
      <div class="fold" data-fold="side-versions"><span class="chev"></span><span class="head">Versions</span></div>
      <div class="body" id="versions"></div>
    </section>
  </aside>

  <div class="view" id="view">
    <canvas id="gl"></canvas>
    <div id="marquee" hidden></div>
    <div id="dim" hidden></div>
    <div id="planeLabels"></div>
    <div class="bar top">
      <span class="tools" data-rooms="sketch" data-sketching>
        <button data-tool="line" title="a line, point by point: click the first point again to close it, Enter to end it open">Line</button><button data-tool="rect" title="a rectangle: two opposite corners">Rectangle</button><button data-tool="circle" title="a circle: its centre, then a point on it">Circle</button>
        <span class="sep"></span>
        <button id="sketchSnap" class="on" title="points line up with the part's corners and land on the 1 mm grid (hold Shift for free)">Snap</button>
      </span>
      <span class="tools" data-rooms="part assembly">
      <button data-sel="vertex" title="select corner points">Points</button><button data-sel="edge" title="select edges">Lines</button><button data-sel="face" class="on" title="select faces">Faces</button><button data-sel="part" data-rooms="assembly" title="select whole objects: the parts of an assembly">Objects</button>
      <button id="measure" title="measure: click one thing, then another, of any kind. The shortest distance between them is drawn in the view">Measure</button>
      <button id="boxTool" title="while on, a plain drag selects with a box instead of turning the view (Shift-drag and Ctrl-drag always do)">Box</button>
      <span class="sep"></span>
      <button data-cam="fit" title="fit to view">Fit</button>
      <button data-cam="iso">Iso</button><button data-cam="top">Top</button><button data-cam="front">Front</button><button data-cam="right">Right</button>
      <span class="sep"></span>
      <select id="style" title="how the part is drawn: with its materials, plainly shaded, or as lines with the hidden ones left out"></select>
      <button id="edges" class="on" title="draw the edges of the part over it">Edges</button>
      <button id="xray" title="see through the part">X-ray</button>
      <button id="section" title="cut the part with a plane to see inside">Section</button>
      <select id="sectionAxis" hidden><option>X</option><option>Y</option><option selected>Z</option></select>
      <input type="range" id="sectionAt" min="0" max="1" step="0.002" value="0.5" hidden>
      <span class="sep" id="asmSep" hidden></span>
      <button id="partColours" class="on" title="every part of the assembly in a colour of its own" hidden>Parts</button>
      <span class="muted" id="explodeLabel" hidden>Explode</span>
      <input type="range" id="explode" min="0" max="1.5" step="0.01" value="0" title="pull the parts of the assembly apart" hidden>
      </span>
    </div>
    <div class="bar bottom" id="compare" hidden>
      <span id="compareLabel" class="muted"></span>
      <button data-mode="added" title="the newer one, coloured where material was added">Added</button>
      <button data-mode="removed" title="the older one, coloured where material was removed">Removed</button>
      <button data-mode="blink" title="flick between the two: the eye catches small jumps">Blink</button>
      <button data-mode="fade" title="crossfade from the older to the newer">Fade</button>
      <button data-mode="wipe" title="older on one side of a plane, newer on the other">Wipe</button>
      <input type="range" id="mix" min="0" max="1" step="0.005" value="0.5" hidden>
      <button id="compareOff">×</button>
    </div>
    <div class="busy" id="busy" hidden>building…</div>
    <div class="hint">drag: orbit · right-drag: pan · wheel: zoom<br>click: select · Shift: add · Ctrl: take away · Shift- or Ctrl-drag: box</div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<dialog id="connectDialog"></dialog>
<script type="module" src="/static/canvas.js"></script>
</body>
</html>
