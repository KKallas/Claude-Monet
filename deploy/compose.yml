# The instance: Monet behind Caddy (HTTPS from Let's Encrypt). Lives in /opt/monet on the droplet together with
# Caddyfile and .env. `docker compose up -d` starts it and it comes back by itself after a reboot.
#
# Monet never runs a Note here: people's agents build on their own computers and upload what a build leaves, which
# the app checks is a build of the files it has (monet/workspace.py accept_build). So there is one container:
#   app     the web app: the logins, the canvas, the agents' door. Holds ./data (accounts, session secret) and
#           ./storage (the working files).
# No root, no capabilities, a read-only file system apart from its volumes and /tmp, ceilings on memory and
# processes. Only Caddy is reachable from outside, and only Caddy can reach out. What an agent key can still do:
# upload measurements of its own workspace that are not what the Note would build (they are claims, and the canvas
# says who built them). Back up ./storage if the work matters.
x-shut: &shut
  image: monet:latest
  restart: unless-stopped
  networks: [inside]
  read_only: true
  tmpfs:
    - /tmp:size=256m
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256

services:
  app:
    <<: *shut
    environment:
      MONET_BASE_URL: https://${DOMAIN}
      MONET_MAX_USERS: ${MONET_MAX_USERS:-20}
      MONET_NOTE: ${MONET_NOTE:-}
    volumes:
      - ./storage:/storage
      - ./data:/data
    # working out the joints of a big assembly again (a person's edit in Motion) takes memory: more than the app alone
    mem_limit: ${APP_MEM:-1500m}
    cpus: ${CPUS:-1.0}

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging:      # it keeps the access log: who came, for what (deploy/Caddyfile). Only so much of it
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [inside, outside]
    depends_on:
      - app

networks:
  inside:
    internal: true      # no route to the internet from here
  outside:

volumes:
  caddy_data:
  caddy_config:
