[project]
name = "monet"
version = "0.7.0"
description = "Impressionist on the surface, exact underneath: CAD by description, checked by rules."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
dependencies = [
    "build123d",
    "trimesh",
    "numpy",
    "scipy",
    "rtree",
    "pillow",
    "starlette",
    "uvicorn",
    "mcp",
    "httpx",
    "segno>=1.6.6",
]

[project.scripts]
monet = "monet.__main__:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["monet"]
include = ["canvas/**", "profiles/**", "notes/**", "skill/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
